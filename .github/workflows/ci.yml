name: Fanix Global CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm exec --workspace apps/web -- expo install --check
      - run: npm exec --workspace apps/mobile -- expo install --check
      - run: npm run export --workspace apps/web
        env:
          EXPO_PUBLIC_API_URL: https://erp-fanix-global.onrender.com/api/v1
      - run: npm exec --workspace apps/mobile -- expo export --platform android --output-dir dist-android
        env:
          EXPO_PUBLIC_API_URL: https://erp-fanix-global.onrender.com/api/v1
